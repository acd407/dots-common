interface      enp5s0f3u1

start          192.168.15.100
end            192.168.15.200

# 子网掩码
option subnet  255.255.255.0

# 路由器/网关地址
option router  192.168.15.1

# DNS服务器
option dns     8.8.8.8,8.8.4.4

# 租约时间（秒）
option lease   3600

# 最大租约时间（秒）
max_leases     100

# 自动分配IP地址的租约文件
lease_file     /tmp/udhcpd.leases

# 其他可选配置：

# 域名
#option domain  local

# 广播地址
#option broadcast   192.168.1.255

# 静态IP地址绑定（MAC地址到IP的映射）
#static_lease 00:11:22:33:44:55 192.168.1.50
#static_lease AA:BB:CC:DD:EE:FF 192.168.1.51

# NTP服务器
#option ntpsrv  192.168.1.1

# WINS服务器
#option wins    192.168.1.1

# MTU大小
#option mtu     1500
